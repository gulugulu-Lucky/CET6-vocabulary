<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f7">

  <title>六级刷词小仓库</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #293247;
      --muted: #858b9a;
      --line: #ebeaf0;
      --page: #faf9f7;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: min(100%, 850px);
      margin: 0 auto;
      padding: clamp(34px, 7vw, 74px) 24px 36px;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #8f91a0;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .19em;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 40px);
      line-height: 1.25;
      letter-spacing: -.045em;
      font-weight: 780;
    }
    .intro {
      margin: 12px 0 0;
      font-size: 15px;
      line-height: 1.7;
      color: #737b8d;
    }
    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 43px 2px 17px;
    }
    .section-heading h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: .02em;
      font-weight: 720;
    }
    .section-heading span {
      color: #9aa0ab;
      font-size: 12px;
    }
    .shelf {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .shelf a {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 118px;
      padding: 22px 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--white);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(43, 47, 68, .025);
      transition: border-color .18s, box-shadow .18s, transform .18s;
      -webkit-tap-highlight-color: transparent;
    }
    .shelf a:hover {
      border-color: #dedde5;
      box-shadow: 0 9px 24px rgba(43, 47, 68, .06);
      transform: translateY(-2px);
    }
    .shelf a:active { transform: translateY(0); }
    .shelf a:focus-visible { outline: 3px solid #919df0; outline-offset: 3px; }
    .data-shelf { grid-template-columns: 1fr; }
    .data-shelf a { min-height: 96px; }
    .icon {
      display: grid;
      place-items: center;
      flex: 0 0 60px;
      height: 60px;
      border-radius: 17px;
      font-size: 27px;
      line-height: 1;
    }
    .blue { background: #edf2ff; }
    .green { background: #eaf6ed; }
    .peach { background: #fff2e7; }
    .pink { background: #faeef4; }
    .info { flex: 1; min-width: 0; }
    .info strong {
      display: block;
      font-size: 17px;
      letter-spacing: -.01em;
      line-height: 1.5;
      font-weight: 730;
    }
    .info small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
    }
    .arrow {
      display: grid;
      place-items: center;
      flex: 0 0 18px;
      color: #aab0bc;
    }
    .arrow svg { display: block; width: 18px; height: 18px; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 32px;
      border-top: 1px solid #ebeaec;
      padding: 18px 2px 0;
      color: #a0a3ad;
      font-size: 12px;
    }
    .footer .paw { font-size: 16px; }
    @media (max-width: 650px) {
      .wrap { padding: 38px 20px calc(32px + env(safe-area-inset-bottom)); }
      .eyebrow { margin-bottom: 13px; }
      h1 { font-size: 30px; }
      .intro { font-size: 14px; margin-top: 10px; }
      .section-heading { margin-top: 33px; margin-bottom: 14px; }
      .shelf { grid-template-columns: 1fr; gap: 11px; }
      .shelf a { min-height: 100px; border-radius: 18px; padding: 17px 16px; gap: 14px; }
      .icon { flex-basis: 55px; height: 55px; border-radius: 15px; font-size: 25px; }
      .info strong { font-size: 16px; }
      .footer { margin-top: 27px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .shelf a { transition: none; }
      .shelf a:hover { transform: none; }
    }
  </style>
</head>
