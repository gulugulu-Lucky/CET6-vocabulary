<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f7">
  <meta name="description" content="六级刷词小仓库：高频词、中频词、手写单词本、阅读重点词与我的收藏。">
  <title>六级刷词小仓库</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #293247;
      --muted: #858b9a;
      --line: #ebeaf0;
      --page: #faf9f7;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: min(100%, 850px);
      margin: 0 auto;
      padding: clamp(34px, 7vw, 74px) 24px 36px;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #8f91a0;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .19em;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 40px);
      line-height: 1.25;
      letter-spacing: -.045em;
      font-weight: 780;
    }
    .intro {
      margin: 12px 0 0;
      font-size: 15px;
      line-height: 1.7;
      color: #737b8d;
    }
    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 43px 2px 17px;
    }
    .section-heading h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: .02em;
      font-weight: 720;
    }
    .section-heading span {
      color: #9aa0ab;
      font-size: 12px;
    }
    .shelf {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .shelf a {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 118px;
      padding: 22px 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--white);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(43, 47, 68, .025);
      transition: border-color .18s, box-shadow .18s, transform .18s;
      -webkit-tap-highlight-color: transparent;
    }
    .shelf a:hover {
      border-color: #dedde5;
      box-shadow: 0 9px 24px rgba(43, 47, 68, .06);
      transform: translateY(-2px);
    }
    .shelf a:active { transform: translateY(0); }
    .shelf a:focus-visible { outline: 3px solid #919df0; outline-offset: 3px; }
    .data-shelf { grid-template-columns: 1fr; }
    .data-shelf a { min-height: 96px; }
    .icon {
      display: grid;
      place-items: center;
      flex: 0 0 60px;
      height: 60px;
      border-radius: 17px;
      font-size: 27px;
      line-height: 1;
    }
    .blue { background: #edf2ff; }
    .green { background: #eaf6ed; }
    .peach { background: #fff2e7; }
    .pink { background: #faeef4; }
    .lavender { background: #efecff; }
    .gold { background: #fff5df; color: #d2a14d; }
    .info { flex: 1; min-width: 0; }
    .info strong {
      display: block;
      font-size: 17px;
      letter-spacing: -.01em;
      line-height: 1.5;
      font-weight: 730;
    }
    .info small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
    }
    .arrow {
      display: grid;
      place-items: center;
      flex: 0 0 18px;
      color: #aab0bc;
    }
    .arrow svg { display: block; width: 18px; height: 18px; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 32px;
      border-top: 1px solid #ebeaec;
      padding: 18px 2px 0;
      color: #a0a3ad;
      font-size: 12px;
    }
    .footer .paw { font-size: 16px; }
    @media (max-width: 650px) {
      .wrap { padding: 38px 20px calc(32px + env(safe-area-inset-bottom)); }
      .eyebrow { margin-bottom: 13px; }
      h1 { font-size: 30px; }
      .intro { font-size: 14px; margin-top: 10px; }
      .section-heading { margin-top: 33px; margin-bottom: 14px; }
      .shelf { grid-template-columns: 1fr; gap: 11px; }
      .shelf a { min-height: 100px; border-radius: 18px; padding: 17px 16px; gap: 14px; }
      .icon { flex-basis: 55px; height: 55px; border-radius: 15px; font-size: 25px; }
      .info strong { font-size: 16px; }
      .footer { margin-top: 27px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .shelf a { transition: none; }
      .shelf a:hover { transform: none; }
    }

    /* Soft pastel palette belongs to the library HOME, not the study cards. */
    :root { --page:#fcfaff; --line:#e9e7f1; }
    html { background:#fcfaff; }
    body {
      background:
        radial-gradient(ellipse 70% 50% at 0% 0%, rgba(255,225,239,.88) 0%, rgba(255,238,247,.40) 54%, transparent 100%),
        radial-gradient(ellipse 72% 57% at 100% 3%, rgba(224,225,255,.95) 0%, rgba(240,235,255,.52) 57%, transparent 100%),
        linear-gradient(170deg,#fffafd 0%,#faf9ff 56%,#fffdfb 100%);
      background-attachment:fixed;
    }
    .eyebrow { color:#9389ac; }
    .intro { color:#89899f; }
    .section-heading span { color:#a19cb0; }
    .shelf a {
      background:rgba(255,255,255,.94);
      border-color:#e8e6ef;
      box-shadow:0 7px 27px rgba(79,72,117,.045),0 1px 3px rgba(79,72,117,.025);
    }
    .shelf a:hover {
      border-color:#d9d1ed;
      box-shadow:0 10px 28px rgba(86,74,137,.09);
    }
    .shelf a[href*="favorites.html"] {
      border-color:#e9e0f0;
      background:linear-gradient(115deg,rgba(255,255,255,.98),rgba(255,251,245,.94));
    }
    .icon.gold {
      background:linear-gradient(135deg,#fff6dd 0%,#fff0cf 100%);
      color:#d7a54b;
    }
    @media (max-width:650px) {
      body {
        background:
          radial-gradient(ellipse 95% 42% at 0% 0%,rgba(255,228,240,.94),transparent 100%),
          radial-gradient(ellipse 100% 47% at 100% 4%,rgba(231,229,255,.95),transparent 100%),
          linear-gradient(170deg,#fffafd,#fbf9ff 65%,#fffdfb);
        background-attachment:fixed;
      }
    }

  </style>
</head>
