<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>手写单词本｜179词刷词｜底部读音按钮</title>
<style>
:root {
  --bg1:#fff7fb; --bg2:#eef5ff; --card:#ffffffcc; --text:#253047;
  --muted:#6d7890; --accent:#ff75a0; --accent2:#7c8cff; --good:#26a269; --bad:#e35d6a;
  --shadow: 0 18px 55px rgba(80, 79, 140, .18);
}
* { box-sizing: border-box; }
body {
  margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text); background:radial-gradient(circle at top left,var(--bg1),transparent 42%),linear-gradient(135deg,#fff,var(--bg2));
}
.app { width:min(920px,100%); margin:0 auto; padding:10px 16px 28px; }
.panel { background:var(--card); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.7); border-radius:26px; padding:16px; box-shadow:var(--shadow); }
.controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
button { font:inherit; border:0; border-radius:16px; padding:12px 14px; background:#fff; color:var(--text); box-shadow:inset 0 0 0 1px #edf0fa; cursor:pointer; transition:none; font-weight:650; }
button:active { transform:none; }
.secondary { background:#f7f8ff; }
.card { min-height:382px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; background:#fff; border-radius:28px; padding:34px 18px; margin-top:8px; position:relative; overflow:hidden; }
.card:before { content:""; position:absolute; width:180px; height:180px; border-radius:50%; background:#fff0f6; top:-72px; right:-72px; }
.unit-tag { position:absolute; top:18px; left:20px; color:var(--muted); font-size:13px; }
.word { font-size:48px; font-weight:800; letter-spacing:.4px; line-height:1.08; word-break:break-word; z-index:1; }
.sound-btn { z-index:1; width:72px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; background:#f7f8ff; color:#253047; box-shadow:inset 0 0 0 1px #e7ebf7; padding:0; }
.meaning { z-index:1; min-height:58px; font-size:23px; line-height:1.45; color:#34415f; padding:0 14px; display:none; white-space:pre-line; }
.meaning.show { display:block; }
.ipa { z-index:1; min-height:28px; font-size:19px; color:var(--muted); letter-spacing:.3px; display:none; }
.ipa.show { display:block; }
.actions { display:grid; grid-template-columns:1fr 72px 1fr; gap:10px; margin-top:12px; }
.good { background:#ebfff5; color:var(--good); }
.bad { background:#fff0f2; color:var(--bad); }
.progress-wrap { height:10px; background:#eef1fb; border-radius:999px; overflow:hidden; margin:14px 2px 8px; }
.progress { height:100%; width:0%; background:linear-gradient(90deg,var(--accent2),var(--accent)); border-radius:999px; transition:.2s width; }
.stats { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:13px; flex-wrap:wrap; }
.modebar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 0; }
.chip { padding:9px 11px; border-radius:999px; background:#fff; box-shadow:inset 0 0 0 1px #edf0fa; font-size:13px; }
.chip.active { background:#253047; color:white; }
.footer { text-align:center; color:var(--muted); font-size:12px; margin-top:14px; }
@media (max-width:720px) {
  .controls { grid-template-columns:1fr; }
  .word { font-size:40px; }
  .meaning { font-size:20px; }
  .ipa { font-size:18px; }
  .card { min-height:385px; }
}

html, body, button, select, .card {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
select, input {
  font-size: 16px;
}
button, .card, .word, .meaning, .ipa {
  user-select: none;
  -webkit-user-select: none;
}


.actions { display:grid !important; grid-template-columns:1fr 98px 1fr !important; gap:10px !important; margin-top:12px !important; align-items:stretch !important; }
.middle-stack { display:grid; grid-template-rows:1fr 1fr; gap:8px; }
.nav-btn { height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:16px; background:#f7f8ff; color:#4d5b79; box-shadow:inset 0 0 0 1px #e7ebf7; padding:0 10px; }
.inline-sound-btn { width:100%; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; background:#f7f8ff; color:#253047; box-shadow:inset 0 0 0 1px #e7ebf7; padding:0; }
button:disabled { opacity:.45; cursor:not-allowed; }
.sound-pocket { display:none !important; }
.hint-toggle,
.hint-note {
  position:absolute;
  z-index:4;
}
.hint-toggle {
  right:auto;
  bottom:auto;
  padding:2px 4px;
  border-radius:6px;
  color:rgba(117,98,78,.48);
  background:transparent;
  box-shadow:none;
  font-size:11px;
  font-weight:500;
  line-height:1.25;
  white-space:nowrap;
  opacity:.58;
  filter:grayscale(.45);
}
.hint-toggle:hover,
.hint-toggle:focus-visible {
  color:rgba(117,98,78,.62);
  background:transparent;
  opacity:.75;
}
.hint-toggle:focus-visible {
  outline:1px solid rgba(166,133,82,.32);
  outline-offset:2px;
}
.hint-note {
  right:18px;
  bottom:16px;
  width:min(310px,calc(100% - 36px));
  padding:10px 13px 11px;
  border-radius:16px;
  color:#5d5143;
  background:rgba(255,251,235,.96);
  box-shadow:inset 0 0 0 1px rgba(214,184,120,.25),0 10px 28px rgba(93,77,50,.12);
  text-align:left;
  line-height:1.45;
}
.hint-toggle[hidden],
.hint-note[hidden] { display:none; }
.ipa:not(.show) ~ .hint-toggle { display:none; }
.hint-note-title { display:block; margin-bottom:2px; color:#8a6f48; font-size:12px; font-weight:750; }
.hint-note-text { display:block; font-size:14px; font-weight:500; }
.hint-sense { display:block; }
.hint-sense + .hint-sense { margin-top:2px; }
@media (max-width:720px) { .actions { grid-template-columns:1fr 92px 1fr !important; } }
@media (max-width:480px) {
  .hint-note { right:14px; bottom:10px; }
  .hint-note { width:calc(100% - 28px); padding:8px 12px 9px; }
  .hint-note-text { font-size:13px; }
}

</style>
</head>

      </div>
      <button class="good" id="yesBtn">会，显示意思</button>
    </div>
  </div>
</div>

DATA.forEach(item => {
  if (Object.prototype.hasOwnProperty.call(HINTS, item.word)) item.hint = HINTS[item.word];
});

function closeHint() {
  $('hintNote').hidden = true;
  $('hintToggle').setAttribute('aria-expanded', 'false');
  $('hintNote').style.top = '';
  $('hintNote').style.bottom = '';
  $('hintNote').style.left = '';
  $('hintNote').style.right = '';
}
function renderHintContent(hint) {
  $('hintText').replaceChildren();
  if (hint.core) {
    $('hintTitle').textContent = '💡 核心理解';
    $('hintText').textContent = hint.core;
    return;
  }
  $('hintTitle').textContent = '💡 分义理解';
  hint.senses.forEach(sense => {
    const line = document.createElement('span');
    line.className = 'hint-sense';
    line.textContent = sense;
    $('hintText').appendChild(line);
  });
}
function updateHintEntry() {
  const item = order.length ? currentItem() : null;
  const hasHint = Boolean(item && item.hint);
  $('hintToggle').hidden = !hasHint;
  $('hintNote').hidden = true;
  if (hasHint) {
    renderHintContent(item.hint);
    requestAnimationFrame(positionHintToggle);
  }
  else $('hintText').replaceChildren();
}
function positionHintToggle() {
  const toggle = $('hintToggle');
  const ipa = $('ipa');
  if (toggle.hidden || getComputedStyle(ipa).display === 'none') return;
  const cardRect = $('card').getBoundingClientRect();
  const anchor = ipa.getBoundingClientRect();
  const toggleRect = toggle.getBoundingClientRect();
  const edge = innerWidth <= 480 ? 8 : 12;
  const gap = 4;
  let left = anchor.right - cardRect.left + gap;
  let top = anchor.top - cardRect.top + (anchor.height - toggleRect.height) / 2;
  left = Math.min(left, cardRect.width - edge - toggleRect.width);
  top = Math.max(52, Math.min(top, cardRect.height - edge - toggleRect.height));
  toggle.style.left = left + 'px';
  toggle.style.top = top + 'px';
}
function placeHintNote() {
  const note = $('hintNote');
  const cardRect = $('card').getBoundingClientRect();
  const ipaRect = $('ipa').getBoundingClientRect();
  const actionsRect = document.querySelector('.actions').getBoundingClientRect();
  const horizontalGap = innerWidth <= 480 ? 14 : 18;
  const verticalGap = 8;
  const cardBottomGap = innerWidth <= 480 ? 10 : 16;

  note.style.left = 'auto';
  note.style.right = 'auto';
  note.style.top = 'auto';
  note.style.bottom = 'auto';
  note.style.maxWidth = 'none';
  note.style.maxHeight = 'none';
  note.style.overflowY = 'visible';
  note.scrollTop = 0;

  const naturalRect = note.getBoundingClientRect();
  const safeLeft = cardRect.left + horizontalGap;
  const safeRight = cardRect.right - horizontalGap;
  const safeTop = ipaRect.bottom + verticalGap;
  const safeBottom = Math.min(cardRect.bottom - cardBottomGap, actionsRect.top - verticalGap);
  const availableWidth = Math.max(0, safeRight - safeLeft);
  const availableHeight = Math.max(0, safeBottom - safeTop);

  note.style.maxWidth = availableWidth + 'px';
  const noteWidth = Math.min(note.getBoundingClientRect().width, availableWidth);
  const centeredLeft = cardRect.left + (cardRect.width - noteWidth) / 2;
  const clampedLeft = Math.max(safeLeft, Math.min(centeredLeft, safeRight - noteWidth));

  note.style.left = clampedLeft - cardRect.left + 'px';
  note.style.top = safeTop - cardRect.top + 'px';
  note.style.maxHeight = availableHeight + 'px';
  note.style.overflowY = naturalRect.height > availableHeight ? 'auto' : 'visible';
}
const renderWithoutHint = render;
render = function() {
  closeHint();
  renderWithoutHint();
  updateHintEntry();
};
$('hintToggle').onclick = event => {
  event.stopPropagation();
  $('hintToggle').hidden = true;
  $('hintToggle').setAttribute('aria-expanded', 'true');
  $('hintNote').hidden = false;
  placeHintNote();
};
$('hintNote').onclick = event => {
  event.stopPropagation();
  closeHint();
  updateHintEntry();
};
function scheduleHintPosition() {
  requestAnimationFrame(() => {
    positionHintToggle();
    if (!$('hintNote').hidden) placeHintNote();
  });
}
const hintPositionObserver = new ResizeObserver(scheduleHintPosition);
['card', 'word', 'meaning', 'ipa'].forEach(id => hintPositionObserver.observe($(id)));
window.addEventListener('resize', scheduleHintPosition);
render();
