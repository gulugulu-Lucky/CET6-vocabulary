<script>
const RESUME_KEY = 'cet6_reading_intervention_resume_v1';
function readResumePosition() {
  try {
    const saved = JSON.parse(localStorage.getItem(RESUME_KEY) || 'null');
    const validIndex = saved && Number.isInteger(saved.dataIndex) && saved.dataIndex >= 0 && saved.dataIndex < DATA.length;
    return validIndex ? saved.dataIndex : null;
  } catch {
    return null;
  }
}
function saveResumePosition(dataIndex) {
  try {
    localStorage.setItem(RESUME_KEY, JSON.stringify({ dataIndex }));
  } catch {}
}
const renderWithoutResume = render;
render = function() {
  renderWithoutResume();
  if (!order.length) return;
  const dataIndex = order[idx];
  if (currentItem()) saveResumePosition(dataIndex);
};
const savedDataIndex = readResumePosition();
order = filteredIndexes();
const savedOrderIndex = order.indexOf(savedDataIndex);
idx = savedOrderIndex >= 0 ? savedOrderIndex : 0;
render();

<script>
let unknownSnapshot = null;

filteredIndexes = function() {
  const s = state();
  if (mode === 'unknown') {
    if (!Array.isArray(unknownSnapshot)) unknownSnapshot = StudyProgress.createUnknownSnapshot(DATA.length, s);
    return unknownSnapshot.slice();
  }
  return DATA.map((_, index) => index).filter(index => mode !== 'unseen' || !s[index]);
};

rebuildOrder = function(shuffle = false) {
  order = filteredIndexes();
  if (shuffle) shuffleArray(order);
  idx = 0;
  render();
};

mark = function(value) {
  if (!order.length) return;
  const dataIndex = order[idx];
  const s = state();
  const outcome = StudyProgress.applyMark(s, dataIndex, value, mode, { libraryId: 'reading_intervention', scope: 'all' });
  historyStack.push({ dataIndex, prevMark: outcome.previous, revealed: shown });
  save(s);
  idx++;
  render();
};

goPrev = function() {
  if (!historyStack.length) return;
  const last = historyStack.pop();
  // Returning to a card must never undo its stored known/unknown result.
  const previousIndex = order.indexOf(last.dataIndex);
  if (previousIndex < 0) { updatePrevBtn(); return; }
  idx = previousIndex;
  render();
  // Always return to the word-only front, just like a new card.
  updatePrevBtn();
};

$('shuffleBtn').onclick = () => rebuildOrder(true);
$('resetBtn').onclick = () => {
  localStorage.removeItem(key());
  historyStack = [];
  unknownSnapshot = mode === 'unknown' ? [] : null;
  rebuildOrder(false);
};
$('prevBtn').onclick = goPrev;
document.querySelectorAll('.chip').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.chip').forEach(item => item.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    historyStack = [];
    unknownSnapshot = mode === 'unknown' ? StudyProgress.createUnknownSnapshot(DATA.length, state()) : null;
    rebuildOrder(false);
  };
});
</script>
<script>

function revealPronunciation(){if(!order.length)return;$('ipa').classList.add('show');speakWord()}
const HINTS = Object.freeze({});
DATA.forEach(item => {
  if (Object.prototype.hasOwnProperty.call(HINTS, item.word)) item.hint = HINTS[item.word];
});

function closeHint() {
  $('hintNote').hidden = true;
  $('hintToggle').setAttribute('aria-expanded', 'false');
  $('hintNote').style.top = '';
  $('hintNote').style.bottom = '';
  $('hintNote').style.left = '';
  $('hintNote').style.right = '';
}
function renderHintContent(hint) {
  $('hintText').replaceChildren();
  if (hint.core) {
    $('hintTitle').textContent = '💡 核心理解';
    $('hintText').textContent = hint.core;
    return;
  }
  $('hintTitle').textContent = '💡 分义理解';
  hint.senses.forEach(sense => {
    const line = document.createElement('span');
    line.className = 'hint-sense';
    line.textContent = sense;
    $('hintText').appendChild(line);
  });
}
function updateHintEntry() {
  const item = order.length ? currentItem() : null;
  const hasHint = Boolean(item && item.hint);
  $('hintToggle').hidden = !hasHint;
  $('hintNote').hidden = true;
  if (hasHint) {
    renderHintContent(item.hint);
    requestAnimationFrame(positionHintToggle);
  }
  else $('hintText').replaceChildren();
}
function positionHintToggle() {
  const toggle = $('hintToggle');
  const ipa = $('ipa');
  if (toggle.hidden || getComputedStyle(ipa).display === 'none') return;
  const cardRect = $('card').getBoundingClientRect();
  const anchor = ipa.getBoundingClientRect();
  const toggleRect = toggle.getBoundingClientRect();
  const edge = innerWidth <= 480 ? 8 : 12;
  const gap = 4;
  let left = anchor.right - cardRect.left + gap;
  let top = anchor.top - cardRect.top + (anchor.height - toggleRect.height) / 2;
  left = Math.min(left, cardRect.width - edge - toggleRect.width);
  top = Math.max(52, Math.min(top, cardRect.height - edge - toggleRect.height));
  toggle.style.left = left + 'px';
  toggle.style.top = top + 'px';
}
function placeHintNote() {
  const note = $('hintNote');
  const cardRect = $('card').getBoundingClientRect();
  const ipaRect = $('ipa').getBoundingClientRect();
  const actionsRect = document.querySelector('.actions').getBoundingClientRect();
  const horizontalGap = innerWidth <= 480 ? 14 : 18;
  const verticalGap = 8;
  const cardBottomGap = innerWidth <= 480 ? 10 : 16;

  note.style.left = 'auto';
  note.style.right = 'auto';
  note.style.top = 'auto';
  note.style.bottom = 'auto';
  note.style.maxWidth = 'none';
  note.style.maxHeight = 'none';
  note.style.overflowY = 'visible';
  note.scrollTop = 0;

  const naturalRect = note.getBoundingClientRect();
  const safeLeft = cardRect.left + horizontalGap;
  const safeRight = cardRect.right - horizontalGap;
  const safeTop = ipaRect.bottom + verticalGap;
  const safeBottom = Math.min(cardRect.bottom - cardBottomGap, actionsRect.top - verticalGap);
  const availableWidth = Math.max(0, safeRight - safeLeft);
  const availableHeight = Math.max(0, safeBottom - safeTop);

  note.style.maxWidth = availableWidth + 'px';
  const noteWidth = Math.min(note.getBoundingClientRect().width, availableWidth);
  const centeredLeft = cardRect.left + (cardRect.width - noteWidth) / 2;
  const clampedLeft = Math.max(safeLeft, Math.min(centeredLeft, safeRight - noteWidth));

  note.style.left = clampedLeft - cardRect.left + 'px';
  note.style.top = safeTop - cardRect.top + 'px';
  note.style.maxHeight = availableHeight + 'px';
  note.style.overflowY = naturalRect.height > availableHeight ? 'auto' : 'visible';
}
const renderWithoutHint = render;
render = function() {
  closeHint();
  renderWithoutHint();
  updateHintEntry();
};
$('hintToggle').onclick = event => {
  event.stopPropagation();
  $('hintToggle').hidden = true;
  $('hintToggle').setAttribute('aria-expanded', 'true');
  $('hintNote').hidden = false;
  placeHintNote();
};
$('hintNote').onclick = event => {
  event.stopPropagation();
  closeHint();
  updateHintEntry();
};
function scheduleHintPosition() {
  requestAnimationFrame(() => {
    positionHintToggle();
    if (!$('hintNote').hidden) placeHintNote();
  });
}
const hintPositionObserver = new ResizeObserver(scheduleHintPosition);
['card', 'word', 'meaning', 'ipa'].forEach(id => hintPositionObserver.observe($(id)));
window.addEventListener('resize', scheduleHintPosition);
render();
</script>
