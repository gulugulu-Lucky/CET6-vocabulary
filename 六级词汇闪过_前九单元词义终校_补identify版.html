<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>六级词汇闪过｜前九单元词义终校版</title>
<style>
html,body,button,select,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}select,input{font-size:16px}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}.notice{position:fixed;inset:auto 16px 16px;z-index:2;padding:12px 14px;border-radius:14px;background:#fff0f2;color:#9b3140;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 8px 28px rgba(80,79,140,.18)}
</style>
</head>
<body>
<iframe id="vocabPage" src="source-pages/cet6-flash-original.html" title="六级词汇闪过"></iframe>
<div id="notice" class="notice" hidden>筛选修复没有成功载入，请刷新页面后重试。</div>
<script>
const frame=document.getElementById('vocabPage');
frame.addEventListener('load',()=>{
  try{
    frame.contentWindow.eval(String.raw`
      function advanceAfterMark(value) {
        const staysInCurrentFilter = mode === 'all' || (mode === 'unknown' && value === 'unknown');
        if (staysInCurrentFilter) idx++;
        else order.splice(idx, 1);
        render();
      }
      markKnown = function() {
        if (!order.length) return;
        const dataIndex = order[idx];
        const s = state();
        historyStack.push({ dataIndex, prevMark: s[dataIndex] ?? null, revealed: shown });
        s[dataIndex] = 'known';
        save(s);
        advanceAfterMark('known');
      };
      markUnknown = function() {
        if (!order.length) return;
        const dataIndex = order[idx];
        const s = state();
        historyStack.push({ dataIndex, prevMark: s[dataIndex] ?? null, revealed: shown });
        s[dataIndex] = 'unknown';
        save(s);
        advanceAfterMark('unknown');
      };
    `);
    frame.focus();
  }catch(error){
    console.error('CET6 filter fix failed',error);
    document.getElementById('notice').hidden=false;
  }
});
</script>
</body>
</html>
